<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f1e8">
<title>IRONFIT PRO • Performance Fitness Architecture</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  /* Signature Oat Milk & Forest Green Luxury Palette */
  --bg: #f5f1e8;           /* Creamy warm oat milk */
  --bg-subtle: #eae4d5;    /* Warm stone oat */
  --card: #faf7f2;         /* Crisp oat porcelain surface */
  --card-elevated: #ffffff;/* Pure elevated surface */
  --card-hover: #f1ebd9;
  
  --border: #e2dbce;       /* Refined warm linen border */
  --border-strong: #cfc5b3;
  --border-focus: #1b4332;
  
  --tx: #142419;           /* Deep botanical pine text */
  --tx-muted: #556c5e;     /* Sage-toned secondary */
  --tx-dim: #84998c;
  
  --primary: #1e4633;      /* Deep British/Botanical Forest Green */
  --primary-hover: #26573f;
  --primary-glow: rgba(30, 70, 51, 0.16);
  --primary-subtle: rgba(30, 70, 51, 0.08);
  --primary-contrast: #f5f1e8; /* Warm oat milk text */
  
  --accent: #3d6b51;       /* Harmonious alpine pine */
  --accent-glow: rgba(61, 107, 81, 0.2);
  --accent-subtle: rgba(61, 107, 81, 0.1);
  
  --warning: #b45309;
  --warning-subtle: rgba(180, 83, 9, 0.08);
  
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 2px 8px rgba(20, 36, 25, 0.04);
  --shadow-md: 0 12px 30px rgba(20, 36, 25, 0.08);
  --shadow-glow: 0 0 20px var(--primary-glow);
  
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Space Grotesk", monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  /* Midnight Forest & Warm Oat Milk */
  --bg: #0c130f;           /* Deep midnight botanical forest */
  --bg-subtle: #121c16;
  --card: #16241c;         /* Pine bark slate */
  --card-elevated: #1d2e24;
  --card-hover: #253b2e;
  
  --border: rgba(245, 241, 232, 0.08);
  --border-strong: rgba(245, 241, 232, 0.16);
  --border-focus: #52946f;
  
  --tx: #f5f1e8;           /* Warm Oat Milk typography */
  --tx-muted: #a7b9ae;     /* Soft warm sage */
  --tx-dim: #728779;
  
  --primary: #4e8c69;      /* Luminous forest leaf */
  --primary-hover: #5fa57c;
  --primary-glow: rgba(78, 140, 105, 0.28);
  --primary-subtle: rgba(78, 140, 105, 0.14);
  --primary-contrast: #0c130f;
  
  --accent: #78a88c;
  --accent-glow: rgba(120, 168, 140, 0.25);
  --accent-subtle: rgba(120, 168, 140, 0.12);
  
  --warning: #f59e0b;
  --warning-subtle: rgba(245, 158, 11, 0.1);
  
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; font-size: 14px; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 96px;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(30, 70, 51, 0.06), transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(61, 107, 81, 0.03), transparent 45%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--card-elevated), var(--card));
  border: 1px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tx);
  font-family: var(--font-mono);
}
.brand-subtitle {
  font-size: 10px;
  color: var(--tx-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.control-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--tx-muted);
  height: 34px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.control-btn svg { width: 14px; height: 14px; stroke-width: 2; }
.control-btn:hover {
  background: var(--card-hover);
  border-color: var(--border-strong);
  color: var(--tx);
}
.control-btn:active { transform: scale(0.96); }

/* Database status pill */
.db-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--tx-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font);
  letter-spacing: 0.02em;
}
.db-pill:hover { border-color: var(--border-strong); background: var(--card-hover); }
.db-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.db-pill.neon-online {
  border-color: rgba(30, 70, 51, 0.4);
  color: var(--primary);
  background: var(--primary-subtle);
}
.db-pill.idb-online {
  border-color: rgba(61, 107, 81, 0.4);
  color: var(--accent);
  background: var(--accent-subtle);
}

/* Streak ticker */
.insight-banner {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.insight-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.insight-metric {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 4px;
}
.insight-metric svg { width: 14px; height: 14px; }
.insight-text {
  font-size: 11px;
  color: var(--tx-muted);
  line-height: 1.3;
}

/* Navigation Tabs */
.view-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--bg-subtle);
  padding: 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.view-tab-btn {
  background: transparent;
  border: none;
  color: var(--tx-muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.01em;
}
.view-tab-btn svg { width: 15px; height: 15px; stroke-width: 2; opacity: 0.7; }
.view-tab-btn:hover { color: var(--tx); }
.view-tab-btn.active {
  background: var(--card-elevated);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.view-tab-btn.active svg { opacity: 1; stroke: var(--primary); }
[data-theme="light"] .view-tab-btn.active {
  background: #ffffff;
}

/* Cards & Surfaces */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease;
}
.card:hover { border-color: var(--border-strong); }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--tx);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.02em;
}
.card-title svg { width: 16px; height: 16px; stroke-width: 2; color: var(--primary); }
.card-caption {
  font-size: 11px;
  color: var(--tx-muted);
  margin-top: 2px;
}

/* Badges */
.pill-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  background: var(--card-elevated);
  color: var(--tx-muted);
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: var(--font-mono);
}
.pill-badge.primary {
  background: var(--primary-subtle);
  color: var(--primary);
  border-color: rgba(30, 70, 51, 0.3);
}

/* Metrics Grid */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 12px 0;
}
@media (min-width: 480px) {
  .metrics-row { grid-template-columns: repeat(4, 1fr); }
}
.metric-tile {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
}
.metric-value {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.02em;
}
.metric-value.primary { color: var(--primary); }
.metric-value.accent { color: var(--accent); }
.metric-label {
  font-size: 10px;
  color: var(--tx-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-top: 3px;
}

/* Day Selector */
.day-track {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 12px;
  scrollbar-width: thin;
}
.day-node {
  flex: 0 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s ease;
  min-width: 82px;
}
.day-node .node-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--tx-dim);
  font-weight: 700;
}
.day-node .node-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--tx);
  margin-top: 2px;
}
.day-node:hover { border-color: var(--border-strong); background: var(--card-hover); }
.day-node.active {
  background: var(--primary-subtle);
  border-color: var(--primary);
  box-shadow: 0 0 14px var(--primary-glow);
}
.day-node.active .node-tag { color: var(--primary); }
.day-node.active .node-title { color: var(--primary); }

/* Progress Bar */
.track-bar {
  width: 100%;
  height: 6px;
  background: var(--bg-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin: 10px 0;
  border: 1px solid var(--border);
}
.track-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: var(--radius-full);
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Exercise Cards */
.ex-module {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  transition: all 0.2s ease;
}
.ex-module.complete {
  border-color: rgba(16, 185, 129, 0.3);
  background: rgba(16, 185, 129, 0.03);
}
.ex-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.ex-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: 0.01em;
}
.ex-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.ex-cue-toggle {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.ex-cue-box {
  background: var(--bg-subtle);
  border-left: 2px solid var(--accent);
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  font-size: 11px;
  color: var(--tx-muted);
  line-height: 1.4;
  margin-bottom: 10px;
  display: none;
}
.ex-cue-box.show { display: block; }

/* Sets Table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 6px 0;
}
.data-table th {
  text-align: center;
  color: var(--tx-dim);
  font-weight: 700;
  font-size: 10px;
  padding: 4px 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: var(--font-mono);
}
.data-table th:first-child { text-align: left; }
.set-line {
  border-top: 1px solid var(--border);
  transition: background 0.15s ease;
}
.set-line.done {
  background: rgba(16, 185, 129, 0.05);
}
.set-line td {
  padding: 6px 4px;
  text-align: center;
  vertical-align: middle;
}
.set-line td:first-child { text-align: left; }
.set-idx {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--tx-dim);
  font-size: 11px;
}
.set-val-input {
  width: 60px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--tx);
  border-radius: var(--radius-xs);
  padding: 6px 4px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  font-family: var(--font-mono);
  transition: border-color 0.15s ease;
}
.set-val-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-subtle);
}
.check-trigger {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--tx-dim);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.15s ease;
}
.check-trigger svg { width: 14px; height: 14px; stroke-width: 2.5; }
.check-trigger.done {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-contrast);
  box-shadow: 0 2px 8px var(--primary-glow);
}
.rest-link-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--accent);
  width: 30px;
  height: 30px;
  border-radius: var(--radius-xs);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
}
.rest-link-btn svg { width: 13px; height: 13px; stroke-width: 2; }
.rest-link-btn:hover { background: var(--accent-subtle); border-color: var(--accent); }

/* Buttons */
.btn {
  background: var(--primary);
  color: var(--primary-contrast);
  border: none;
  font-family: var(--font);
  font-weight: 700;
  font-size: 13px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.02em;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 12px var(--primary-glow);
}
.btn svg { width: 16px; height: 16px; stroke-width: 2; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active { transform: translateY(0); }
.btn-outline {
  background: var(--card-elevated);
  color: var(--tx);
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn-outline:hover { background: var(--card-hover); border-color: var(--border-strong); }
.btn-sm { padding: 6px 12px; font-size: 11px; }
.btn-block { width: 100%; }

/* Floating Timer Dock */
.timer-dock {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  max-width: 500px;
  background: var(--bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow-md);
  z-index: 1000;
}
[data-theme="light"] .timer-dock {
  background: rgba(255, 255, 255, 0.94);
}
.timer-radial-wrap {
  position: relative;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
}
.timer-radial-svg {
  transform: rotate(-90deg);
  width: 40px;
  height: 40px;
}
.timer-track-circle {
  stroke: var(--border);
  stroke-width: 3;
  fill: none;
}
.timer-fill-circle {
  stroke: var(--primary);
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
}
.timer-digits {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--tx);
}
.timer-preset-capsules {
  display: flex;
  gap: 4px;
}
.preset-capsule {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--tx);
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 700;
  border-radius: var(--radius-xs);
  cursor: pointer;
}
.preset-capsule:hover {
  background: var(--primary-subtle);
  border-color: var(--primary);
  color: var(--primary);
}

/* Barbell Visualizer */
.bar-rig {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px 12px;
  margin: 14px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 110px;
}
.bar-shaft {
  height: 10px;
  background: #64748b;
  width: 100%;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 4px;
}
.bar-collar {
  width: 16px;
  height: 36px;
  background: #94a3b8;
  border-radius: 2px;
  z-index: 2;
  margin-right: 4px;
}
.plate-rack {
  display: flex;
  align-items: center;
  gap: 3px;
  z-index: 2;
}
.disc {
  border-radius: 3px;
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  box-shadow: 2px 0 6px rgba(0, 0, 0, 0.4);
  writing-mode: vertical-rl;
  text-orientation: upright;
}
.d-25 { background: #ef4444; height: 90px; width: 16px; }
.d-20 { background: #3b82f6; height: 90px; width: 15px; }
.d-15 { background: #eab308; height: 78px; width: 13px; }
.d-10 { background: #10b981; height: 68px; width: 11px; }
.d-5  { background: #e2e8f0; color: #0f172a; height: 56px; width: 10px; }
.d-2_5 { background: #1e293b; border: 1px solid #64748b; height: 44px; width: 8px; }
.d-1_25{ background: #64748b; height: 36px; width: 7px; }

/* Water Matrix */
.water-matrix {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.water-unit {
  width: 24px;
  height: 34px;
  border: 1.5px solid var(--border-strong);
  border-radius: 4px 4px 6px 6px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.water-unit.filled {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

/* Modals */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.sheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.sheet-modal {
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 480px;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-md);
  transform: translateY(12px);
  transition: transform 0.2s ease;
}
.sheet-backdrop.open .sheet-modal { transform: translateY(0); }
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.sheet-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.sheet-close {
  background: none;
  border: none;
  color: var(--tx-dim);
  cursor: pointer;
  padding: 4px;
}
.sheet-close svg { width: 18px; height: 18px; stroke-width: 2; }
.sheet-close:hover { color: var(--tx); }

/* Form Controls */
.field-box { margin-bottom: 12px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--tx-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--tx);
  border-radius: var(--radius-xs);
  padding: 9px 12px;
  font-size: 13px;
  font-family: var(--font);
  transition: border-color 0.15s ease;
}
.field-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-subtle);
}

/* Tool Grid */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.tool-card {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tool-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}
.tool-card-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-xs);
  background: var(--bg);
  display: grid;
  place-items: center;
  color: var(--primary);
  margin-bottom: 8px;
}
.tool-card-icon svg { width: 16px; height: 16px; }
.tool-card-name { font-size: 13px; font-weight: 700; color: var(--tx); }
.tool-card-meta { font-size: 11px; color: var(--tx-dim); margin-top: 2px; }

#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3000;
}
</style>

let idb = null;
const IDB_NAME = "IronFitGymDB";
const IDB_VERSION = 1;

function getApiEndpoint() {
  const custom = localStorage.getItem("ironfit_api_url");
  if (custom) return custom.replace(/\/$/, "");
  if (window.location.protocol.startsWith("http")) {
    return window.location.origin + "/api";
  }
  return "http://localhost:3000/api";
}

let dbInfo = {
  isServerOnline: false,
  serverStats: null
};

// 1. IndexedDB Browser Engine
function openIndexedDB() {
  return new Promise(resolve => {
    if (!window.indexedDB) return resolve(null);
    try {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("app_state")) db.createObjectStore("app_state", { keyPath: "id" });
        if (!db.objectStoreNames.contains("workouts")) db.createObjectStore("workouts", { keyPath: "date" });
        if (!db.objectStoreNames.contains("measurements")) db.createObjectStore("measurements", { keyPath: "id" });
      };
      req.onsuccess = e => { idb = e.target.result; resolve(idb); };
      req.onerror = () => resolve(null);
    } catch (err) {
      resolve(null);
    }
  });
}

function saveToIndexedDB(state) {
  if (!idb) return Promise.resolve(false);
  return new Promise(resolve => {
    try {
      const tx = idb.transaction(["app_state", "workouts", "measurements"], "readwrite");
      tx.objectStore("app_state").put({ id: "main", data: JSON.stringify(state), updated_at: new Date().toISOString() });
      for (const [date, rec] of Object.entries(state.days || {})) {
        tx.objectStore("workouts").put({ date, rec, updated_at: new Date().toISOString() });
      }
      for (const m of state.body || []) {
        tx.objectStore("measurements").put({ id: String(m.id), ...m });
      }
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

function loadFromIndexedDB() {
  if (!idb) return Promise.resolve(null);
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("app_state", "readonly");
      const req = tx.objectStore("app_state").get("main");
      req.onsuccess = () => {
        if (req.result && req.result.data) {
          try { resolve(JSON.parse(req.result.data)); } catch (e) { resolve(null); }
        } else {
          resolve(null);
        }
      };
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

// 2. Neon Cloud / Server API Client
async function checkBackendServer() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 1400);
    const res = await fetch(`${getApiEndpoint()}/status`, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (res.ok) {
      const data = await res.json();
      dbInfo.isServerOnline = true;
      dbInfo.serverStats = data;
      updateDBBadge();
      return true;
    }
  } catch (e) {}

  dbInfo.isServerOnline = false;
  updateDBBadge();
  return false;
}

async function loadFromBackend() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 2000);
    const res = await fetch(`${getApiEndpoint()}/state`, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (res.ok) return await res.json();
  } catch (e) {}
  return null;
}

async function saveToBackend(state) {
  try {
    const res = await fetch(`${getApiEndpoint()}/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

function updateDBBadge() {
  const badge = document.getElementById("dbStatusBadge");
  const text = document.getElementById("dbBadgeText");
  const saveStatus = document.getElementById("saveStatus");

  if (!badge || !text) return;

  if (dbInfo.isServerOnline && dbInfo.serverStats) {
    const isNeon = dbInfo.serverStats.database && dbInfo.serverStats.database.includes("Neon");
    badge.className = "db-pill neon-online";
    text.textContent = isNeon ? "Neon Cloud" : "Database Live";
    badge.title = isNeon ? `Neon Cloud Postgres (${dbInfo.serverStats.projectId})` : "Database Server Online";
    if (saveStatus) saveStatus.textContent = `Synced with Neon Cloud (${dbInfo.serverStats.branch || 'production'})`;
  } else if (idb) {
    badge.className = "db-pill idb-online";
    text.textContent = "Offline Ready";
    badge.title = "Persistent IndexedDB Storage Active";
    if (saveStatus) saveStatus.textContent = "Saved to Device Storage (IndexedDB)";
  } else {
    badge.className = "db-pill";
    text.textContent = "Local";
    if (saveStatus) saveStatus.textContent = "Saved locally";
  }
}

// State Initializer
async function initStorage() {
  await openIndexedDB();

  let loaded = false;

  const serverUp = await checkBackendServer();
  if (serverUp) {
    const remoteData = await loadFromBackend();
    if (remoteData && (Object.keys(remoteData.days || {}).length > 0 || (remoteData.body && remoteData.body.length > 0))) {
      S = remoteData;
      loaded = true;
    }
  }

  if (!loaded) {
    const idbData = await loadFromIndexedDB();
    if (idbData && (Object.keys(idbData.days || {}).length > 0 || (idbData.body && idbData.body.length > 0))) {
      S = idbData;
      loaded = true;
    }
  }

  if (!loaded) {
    try {
      const raw = localStorage.getItem("ironfit_data") || localStorage.getItem("fit");
      if (raw) { S = JSON.parse(raw); loaded = true; }
    } catch (e) {}
  }

  if (serverUp && loaded) {
    saveToBackend(S);
  }

  if (!S.days) S.days = {};
  if (!S.body) S.body = [];
  if (!S.prs) S.prs = {};
  if (!S.customEx) S.customEx = {};

  // Apply theme
  const savedTheme = localStorage.getItem("ironfit_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon();

  updateStreak();
  renderApp();
  updateDBBadge();
}

function saveState() {
  const json = JSON.stringify(S);

  try {
    localStorage.setItem("ironfit_data", json);
    localStorage.setItem("fit", json);
  } catch (e) {}

  saveToIndexedDB(S);

  if (dbInfo.isServerOnline) {
    saveToBackend(S);
  }

  const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const statusEl = document.getElementById("saveStatus");
  if (statusEl) {
    statusEl.textContent = dbInfo.isServerOnline
      ? `Synced to Neon Cloud (${timeStr})`
      : `Saved locally (${timeStr})`;
  }
}

/* ==========================================================================
   AUDIO & HAPTIC SYSTEM
   ========================================================================== */
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playBeep(freq = 880, duration = 0.12, type = "sine") {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function playSuccessChime() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => playBeep(freq, 0.2, "triangle"), idx * 100);
    });
  } catch (e) {}
}

function triggerHaptic(duration = 20) {
  if ("vibrate" in navigator) {
    try { navigator.vibrate(duration); } catch (e) {}
  }
}

/* ==========================================================================
   REST TIMER CONTROLLER
   ========================================================================== */
let restTimerInterval = null;
let restTimeRemaining = 0;
let restTotalDuration = 60;

function startRestTimer(seconds) {
  clearInterval(restTimerInterval);
  restTotalDuration = seconds;
  restTimeRemaining = seconds;
  getAudioContext();
  triggerHaptic(35);
  playBeep(660, 0.08);

  updateRestTimerUI();

  restTimerInterval = setInterval(() => {
    restTimeRemaining--;
    if (restTimeRemaining <= 0) {
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      restTimeRemaining = 0;
      playSuccessChime();
      triggerHaptic([150, 80, 200]);
      document.getElementById("restStatusText").textContent = "INTERVAL COMPLETE";
      document.getElementById("restSubText").textContent = "Commence next sequence";
    } else if (restTimeRemaining <= 3) {
      playBeep(440, 0.06);
      triggerHaptic(15);
    }
    updateRestTimerUI();
  }, 1000);
}

function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  restTimeRemaining = 0;
  updateRestTimerUI();
  document.getElementById("restStatusText").textContent = "REST INTERVAL";
  document.getElementById("restSubText").textContent = "Select preset to initiate";
}

function updateRestTimerUI() {
  const mins = Math.floor(restTimeRemaining / 60);
  const secs = restTimeRemaining % 60;
  const str = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");

  const displayNum = document.getElementById("restCountdown");
  const quickDisplay = document.getElementById("quickTimerDisplay");
  if (displayNum) displayNum.textContent = restTimeRemaining > 0 ? (mins > 0 ? `${mins}m` : `${secs}s`) : "00";
  if (quickDisplay) quickDisplay.textContent = restTimeRemaining > 0 ? str : "Rest";

  const circle = document.getElementById("timerRing");
  if (circle) {
    const circumference = 2 * Math.PI * 16; // ~100.5
    const offset = restTotalDuration > 0 ? circumference * (1 - (restTimeRemaining / restTotalDuration)) : 0;
    circle.style.strokeDashoffset = offset;
  }
}

function renderExerciseModule(ex, idx, dayRec) {
  let loggedSets = dayRec.sets[ex.id];
  if (!loggedSets || loggedSets.length === 0) {
    loggedSets = [];
    for (let i = 0; i < ex.sets; i++) {
      loggedSets.push({ w: "", r: ex.reps.split("-")[0] || "10", done: false });
    }
    dayRec.sets[ex.id] = loggedSets;
  }

  const previousBest = findPreviousSetData(ex.id);
  const isAllComplete = loggedSets.every(s => s.done);

  return `
    <div class="ex-module ${isAllComplete ? 'complete' : ''}" data-exid="${ex.id}">
      <div class="ex-header">
        <div>
          <div class="ex-title">${idx + 1}. ${ex.name}</div>
          <div class="ex-sub">
            <span class="pill-badge accent">${ex.muscle}</span>
            <span style="font-size:11px; color:var(--tx-dim); font-family:var(--font-mono);">${ex.sets} sets × ${ex.reps}</span>
            ${previousBest ? `<span style="font-size:11px; color:var(--tx-muted); font-family:var(--font-mono);">Prev: ${previousBest}</span>` : ''}
          </div>
        </div>
        <button class="ex-cue-toggle" data-tip="${ex.id}">
          <span>Cue</span>
          ${SVG_ICONS.chevronRight}
        </button>
      </div>

      <div class="ex-cue-box" id="tip-${ex.id}">
        <strong>Biomechanical Cue:</strong> ${ex.tip}
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th style="width:32px;">Set</th>
            <th style="width:58px;">Target</th>
            <th>Weight (kg)</th>
            <th>Reps</th>
            <th style="width:36px;">Done</th>
            <th style="width:36px;">Rest</th>
          </tr>
        </thead>
        <tbody>
          ${loggedSets.map((set, sIdx) => `
            <tr class="set-line ${set.done ? 'done' : ''}">
              <td><span class="set-idx">${sIdx + 1}</span></td>
              <td style="font-family:var(--font-mono); font-size:11px; color:var(--tx-dim);">${ex.reps}</td>
              <td>
                <input type="number" step="0.5" class="set-val-input set-weight" data-ex="${ex.id}" data-set="${sIdx}" placeholder="kg" value="${set.w || ''}">
              </td>
              <td>
                <input type="number" class="set-val-input set-reps" data-ex="${ex.id}" data-set="${sIdx}" placeholder="reps" value="${set.r || ''}">
              </td>
              <td>
                <button class="check-trigger ${set.done ? 'done' : ''}" data-act="check-set" data-ex="${ex.id}" data-set="${sIdx}">
                  ${set.done ? SVG_ICONS.check : ''}
                </button>
              </td>
              <td>
                <button class="rest-link-btn" data-act="quick-rest" title="Trigger 60s Rest">
                  ${SVG_ICONS.clock}
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:8px;">
        <button class="control-btn btn-sm" data-act="add-set" data-ex="${ex.id}">+ Add Set</button>
        ${loggedSets.length > 1 ? `<button class="control-btn btn-sm" data-act="del-set" data-ex="${ex.id}">Remove</button>` : ''}
      </div>
    </div>
  `;
}

function findPreviousSetData(exId) {
  const dates = Object.keys(S.days).filter(d => d < selectedDateStr).sort().reverse();
  for (const d of dates) {
    const rec = S.days[d];
    if (rec.sets && rec.sets[exId] && rec.sets[exId].length) {
      const valid = rec.sets[exId].filter(s => s.w);
      if (valid.length) return `${valid[0].w}kg × ${valid[0].r || 10}`;
    }
  }

function renderMinimalSVGChart(records, key, label, unit, color) {
  const filtered = records.filter(r => r[key] && !isNaN(parseFloat(r[key])));
  if (filtered.length < 2) {
    return `
      <div style="background:var(--bg-subtle); padding:10px 14px; border-radius:var(--radius-sm); margin:10px 0; border:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; font-size:12px;">
          <span style="font-weight:700;">${label}</span>
          <span style="color:var(--tx-dim);">Minimum 2 entries required for trend</span>
        </div>
      </div>
    `;
  }

  const values = filtered.map(r => parseFloat(r[key]));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const first = values[0];
  const last = values[values.length - 1];
  const delta = (last - first).toFixed(1);
  const deltaSign = delta > 0 ? `+${delta}` : `${delta}`;

  const width = 300;
  const height = 80;
  const padX = 14;
  const padY = 14;

  const points = values.map((val, idx) => {
    const x = padX + idx * ((width - 2 * padX) / (values.length - 1));
    const y = height - padY - ((val - min) / range) * (height - 2 * padY);
    return [x.toFixed(1), y.toFixed(1)];
  });

  const polylineStr = points.map(p => p.join(",")).join(" ");

  return `
    <div style="background:var(--bg-subtle); padding:12px; border-radius:var(--radius-sm); margin:10px 0; border:1px solid var(--border);">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <span style="font-size:12px; font-weight:700;">${label}</span>
        <span style="font-size:11px; font-family:var(--font-mono); color:${color}; font-weight:700;">${first} → ${last} ${unit} (${deltaSign})</span>
      </div>
      <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto;">
        <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polylineStr}"/>
        ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join("")}
      </svg>
    </div>
  `;
}

/* ==========================================================================
   CONFETTI CELEBRATION
   ========================================================================== */
function launchConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const palette = ["#1e4633", "#3d6b51", "#f5f1e8", "#c8a96e", "#4e8c69"];

  for (let i = 0; i < 90; i++) {
    pieces.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      w: Math.random() * 7 + 3,
      h: Math.random() * 5 + 3,
      color: palette[Math.floor(Math.random() * palette.length)],
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.7) * 16,
      rot: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 8,
      alpha: 1
    });
  }

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.rot += p.rSpeed;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        active = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    });
    if (active) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(frame);
}

// Global Event Delegate
document.addEventListener("click", e => {
  const tab = e.target.closest(".view-tab-btn");
  if (tab) {
    activeTab = tab.dataset.tab;
    renderApp();
    return;
  }

  const day = e.target.closest(".day-node");
  if (day) {
    selectedDayNum = parseInt(day.dataset.day);
    renderApp();
    return;
  }

  const cue = e.target.closest(".ex-cue-toggle");
  if (cue) {
    const box = document.getElementById(`tip-${cue.dataset.tip}`);
    if (box) box.classList.toggle("show");
    return;
  }

  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    const dayRec = getDayRecord(selectedDateStr);

    if (a === "check-set") {
      const exId = act.dataset.ex;
      const idx = parseInt(act.dataset.set);
      if (dayRec.sets[exId] && dayRec.sets[exId][idx]) {
        const item = dayRec.sets[exId][idx];
        item.done = !item.done;

        const row = act.closest(".set-line");
        const w = row.querySelector(".set-weight")?.value;
        const r = row.querySelector(".set-reps")?.value;
        if (w) item.w = w;
        if (r) item.r = r;

        triggerHaptic(item.done ? 35 : 15);
        if (item.done) {
          playBeep(880, 0.1);
          startRestTimer(60);
        }
        saveState();
        renderApp();
      }
      return;
    }

    if (a === "add-set") {
      const exId = act.dataset.ex;
      if (!dayRec.sets[exId]) dayRec.sets[exId] = [];
      const last = dayRec.sets[exId][dayRec.sets[exId].length - 1];
      dayRec.sets[exId].push({ w: last ? last.w : "", r: last ? last.r : "10", done: false });
      saveState();
      renderApp();
      return;
    }

    if (a === "del-set") {
      const exId = act.dataset.ex;
      if (dayRec.sets[exId] && dayRec.sets[exId].length > 1) {
        dayRec.sets[exId].pop();
        saveState();
        renderApp();
      }
      return;
    }

    if (a === "quick-rest") {
      startRestTimer(60);
      return;
    }

    if (a === "toggle-glass") {
      dayRec.water = parseInt(act.dataset.idx) + 1;
      triggerHaptic(20);
      playBeep(520, 0.08);
      saveState();
      renderApp();
      return;
    }

    if (a === "water-add") {
      dayRec.water = Math.min(24, (dayRec.water || 0) + 1);
      triggerHaptic(20);
      playBeep(600, 0.08);
      saveState();
      renderApp();
      return;
    }

    if (a === "water-sub") {
      dayRec.water = Math.max(0, (dayRec.water || 0) - 1);
      saveState();
      renderApp();
      return;
    }

    if (a === "water-bottle") {
      dayRec.water = Math.min(24, (dayRec.water || 0) + 2);
      triggerHaptic(30);
      playBeep(680, 0.1);
      saveState();
      renderApp();
      return;
    }


  }

  const pCap = e.target.closest(".preset-capsule");
  if (pCap) {
    startRestTimer(parseInt(pCap.dataset.timer));
    return;
  }

  if (e.target.closest("#timerToggleBtn")) {
    if (restTimerInterval) stopRestTimer();
    else startRestTimer(60);
    return;
  }

  if (e.target.closest("#timerQuickBtn")) {
    startRestTimer(60);
    return;
  }

  if (e.target.closest("#themeToggle")) {
    toggleTheme();
    return;
  }

  if (e.target.closest("#langToggle")) {
    toggleLang();
    return;
  }

  if (e.target.closest("#toolsBtn")) {
    activeTab = "tools";
    renderApp();
    return;
  }

  const toolCard = e.target.closest(".tool-card");
  if (toolCard) {
    const t = toolCard.dataset.tool;
    const area = document.getElementById("activeToolArea");
    if (area) {
      if (t === "plate") area.innerHTML = renderPlateCalculatorHTML();
      if (t === "1rm") { area.innerHTML = render1RMCalculatorHTML(); update1RMDisplay(); }
      if (t === "tdee") area.innerHTML = `<div class="card"><div class="card-title">Metabolic TDEE Calculator</div><div class="card-caption">Calculated via Harris-Benedict formula</div><div style="font-size:13px; margin-top:8px; color:var(--tx-muted);">Target: ~1,650 kcal daily with 100g minimum protein for progressive recomposition.</div></div>`;
      if (t === "hiit") area.innerHTML = `<div class="card"><div class="card-title">Interval Circuit</div><div class="card-caption">30 seconds work, 15 seconds rest across 8 cycles</div><button class="btn btn-block" style="margin-top:12px;" onclick="startRestTimer(30)">Initiate 30s Interval</button></div>`;
    }
    return;
  }

  if (e.target.closest("#finishWorkoutBtn")) {
    launchConfetti();
    playSuccessChime();
    triggerHaptic([60, 40, 80, 40, 200]);
    updateStreak();
    showModal("Session Complete", `
      <div style="text-align:center; padding:10px 0;">
        <h4 style="font-size:16px; font-weight:800; color:var(--primary); margin-bottom:6px;">Target Volume Achieved</h4>
        <p style="font-size:12px; color:var(--tx-muted); margin-bottom:16px;">
          Progressive overload registered. Ensure high protein synthesis window and restorative rest.
        </p>
        <button class="btn btn-block" onclick="closeModal()">Dismiss</button>
      </div>
    `);
    return;
  }

  if (e.target.closest("#addMeasBtn")) {
    const d = document.getElementById("measDate")?.value;
    const w = document.getElementById("measWeight")?.value;
    const k = document.getElementById("measWaist")?.value;
    const h = document.getElementById("measHips")?.value;

    if (!d || !(w || k || h)) {
      alert("Provide date and measurement entry.");
      return;
    }

    S.body = S.body.filter(x => x.d !== d);
    S.body.push({ id: Date.now(), d, w, k, h });
    saveState();
    renderApp();
    return;
  }

  // Database Management Sheet
  if (e.target.closest("#dbStatusBadge") || e.target.closest("#saveStatus") || e.target.closest("#backupLink")) {
    e.preventDefault();
    const stats = dbInfo.serverStats;
    const isNeon = stats && stats.database && stats.database.includes("Neon");

    showModal("Data Architecture", `
      <div style="font-size:12px;">
        <div style="display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--radius-sm); background:var(--card-elevated); border:1px solid var(--border); margin-bottom:12px;">
          <div style="width:8px; height:8px; border-radius:50%; background:${isNeon ? 'var(--primary)' : 'var(--accent)'}; box-shadow:0 0 8px currentColor;"></div>
          <div>
            <div style="font-weight:700; color:var(--tx); font-size:13px;">${isNeon ? 'Neon Cloud Postgres (PostgreSQL 18.6)' : 'Client-Side Persistent IndexedDB'}</div>
            <div style="font-size:11px; color:var(--tx-dim);">${isNeon ? stats.host : 'Device-isolated storage'}</div>
          </div>
        </div>

        <div style="background:var(--bg-subtle); padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:12px; font-family:var(--font-mono); font-size:11px;">
          <div>Endpoint: <span style="color:var(--accent);">${getApiEndpoint()}</span></div>
          ${stats ? `<div>Project: ${stats.projectId} (${stats.branch || 'production'})</div>` : ''}
          ${stats ? `<div>Workouts Stored: ${stats.workoutsLogged}</div>` : ''}
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn btn-block btn-outline btn-sm" id="exportJsonBtn">Export JSON</button>
          <button class="btn btn-block btn-outline btn-sm" onclick="document.getElementById('importFile').click()">Restore</button>
          <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>
      </div>
    `);
    return;
  }

  if (e.target.closest("#exportJsonBtn")) {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ironfit-data-${selectedDateStr}.json`;
    a.click();
    return;
  }

  if (e.target.closest("#modalClose") || e.target === document.getElementById("modalOverlay")) {
    closeModal();
    return;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  const dayRec = getDayRecord(selectedDateStr);

  if (t.classList.contains("set-weight")) {
    const ex = t.dataset.ex;
    const idx = parseInt(t.dataset.set);
    if (dayRec.sets[ex] && dayRec.sets[ex][idx]) {
      dayRec.sets[ex][idx].w = t.value;
      saveState();
    }
  } else if (t.classList.contains("set-reps")) {
    const ex = t.dataset.ex;
    const idx = parseInt(t.dataset.set);
    if (dayRec.sets[ex] && dayRec.sets[ex][idx]) {
      dayRec.sets[ex][idx].r = t.value;
      saveState();
    }
  } else if (t.id === "stepsInput") {
    dayRec.steps = parseInt(t.value) || 0;
    saveState();
  } else if (t.id === "sleepInput") {
    dayRec.sleep = parseFloat(t.value) || 0;
    saveState();
  } else if (t.id === "plateTargetInput" || t.id === "barWeightSelect") {
    const target = parseFloat(document.getElementById("plateTargetInput")?.value) || 60;
    const bar = parseFloat(document.getElementById("barWeightSelect")?.value) || 20;
    const area = document.getElementById("activeToolArea");
    if (area) area.innerHTML = renderPlateCalculatorHTML(target, bar);
  } else if (t.id === "ormWeight" || t.id === "ormReps") {
    update1RMDisplay();
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "datePicker" && t.value) {
    selectedDateStr = t.value;
    selectedDayNum = new Date(t.value + "T12:00:00").getDay();
    renderApp();
  } else if (t.id === "importFile") {
    const file = t.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && (parsed.days || parsed.body)) {
            S = parsed;
            saveState();
            closeModal();
            renderApp();
          }
        } catch (err) {}
      };
      reader.readAsText(file);
    }
  }
});

initStorage();
</script>
</body>
</html>

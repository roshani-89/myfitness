<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<title>IRONFIT Pro • Gym Tracker & 6-Day Split</title>
<style>
:root {
  --bg: #0b0e14;
  --bg-subtle: #11151f;
  --card: #161c28;
  --card-elevated: #1e2638;
  --card-hover: #242e42;
  --border: #232c3f;
  --border-light: #2d3850;
  --tx: #f3f5f9;
  --tx-muted: #8b9bb4;
  --tx-dim: #5c6b84;
  
  --primary: #ff2a6d;
  --primary-hover: #ff4783;
  --primary-glow: rgba(255, 42, 109, 0.28);
  --primary-subtle: rgba(255, 42, 109, 0.12);
  
  --accent: #05d9e8;
  --accent-glow: rgba(5, 217, 232, 0.25);
  
  --success: #00e676;
  --success-subtle: rgba(0, 230, 118, 0.15);
  --warning: #ffb300;
  --warning-subtle: rgba(255, 179, 0, 0.15);
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
  --shadow-glow: 0 0 20px var(--primary-glow);
  
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f5f7fb;
  --bg-subtle: #eaeff7;
  --card: #ffffff;
  --card-elevated: #f0f4fc;
  --card-hover: #e6edf9;
  --border: #d7e0f0;
  --border-light: #c5d2e7;
  --tx: #131b2e;
  --tx-muted: #62728d;
  --tx-dim: #94a3b8;
  
  --primary: #e61958;
  --primary-hover: #ff2a6d;
  --primary-glow: rgba(230, 25, 88, 0.2);
  --primary-subtle: rgba(230, 25, 88, 0.08);
  
  --accent: #0099b8;
  --accent-glow: rgba(0, 153, 184, 0.2);
  
  --success: #059669;
  --success-subtle: rgba(5, 150, 105, 0.1);
  --warning: #d97706;
  --warning-subtle: rgba(217, 119, 6, 0.1);
  
  --shadow-sm: 0 2px 6px rgba(20,30,50,0.06);
  --shadow-md: 0 8px 20px rgba(20,30,50,0.1);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; font-size: 15px; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 90px;
  background-image: radial-gradient(circle at 50% 0%, var(--primary-subtle), transparent 45%);
  background-attachment: fixed;
}

/* Container */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #9b00e8);
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.brand-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.5px;
  background: linear-gradient(90deg, #fff, var(--tx-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
[data-theme="light"] .brand-title {
  background: linear-gradient(90deg, #111, var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--tx-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--tx);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.15s ease;
}
.icon-btn:hover { background: var(--card-hover); border-color: var(--border-light); }
.icon-btn:active { transform: scale(0.95); }

/* Database status pill */
.db-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: var(--radius-full);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--tx-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.db-pill:hover { border-color: var(--border-light); background: var(--card-hover); }
.db-pill.sqlite-online {
  border-color: rgba(0, 230, 118, 0.4);
  color: var(--success);
  background: var(--success-subtle);
  box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
}
.db-pill.neon-online {
  border-color: rgba(0, 230, 118, 0.6);
  color: #00e676;
  background: rgba(0, 230, 118, 0.15);
  box-shadow: 0 0 12px rgba(0, 230, 118, 0.25);
}
.db-pill.idb-online {
  border-color: rgba(5, 217, 232, 0.4);
  color: var(--accent);
  background: rgba(5, 217, 232, 0.1);
}
.db-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}

/* Streak banner */
.streak-bar {
  background: linear-gradient(90deg, rgba(255,42,109,0.15), rgba(5,217,232,0.12));
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.streak-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}
.streak-flame {
  font-size: 22px;
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* Nav Tabs */
.main-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  background: var(--bg-subtle);
  padding: 5px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.tab-btn {
  background: transparent;
  border: none;
  color: var(--tx-muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tab-btn span.tab-icon { font-size: 16px; }
.tab-btn.active {
  background: var(--card-elevated);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
[data-theme="light"] .tab-btn.active {
  background: #ffffff;
  color: var(--primary);
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: border-color 0.2s ease;
}
.card:hover { border-color: var(--border-light); }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-subtitle {
  font-size: 12px;
  color: var(--tx-muted);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  background: var(--primary-subtle);
  color: var(--primary);
  border: 1px solid rgba(255,42,109,0.3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge.accent {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: rgba(5,217,232,0.3);
}
.badge.success {
  background: var(--success-subtle);
  color: var(--success);
  border-color: rgba(0,230,118,0.3);
}

/* Progress bar */
.progress-bar-wrap {
  width: 100%;
  height: 8px;
  background: var(--bg-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin: 10px 0;
  border: 1px solid var(--border);
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: var(--radius-full);
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Day selector */
.day-scroller {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}
.day-chip {
  flex: 0 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius-md);
  font-size: 12px;
  font-weight: 600;
  color: var(--tx-muted);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s ease;
  min-width: 76px;
}
.day-chip .chip-day { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--tx-dim); }
.day-chip .chip-name { font-size: 12px; font-weight: 700; color: var(--tx); margin-top: 2px; }
.day-chip.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px var(--primary-glow);
}
.day-chip.active .chip-day, .day-chip.active .chip-name { color: #fff; }
.day-chip.today-badge { border-color: var(--accent); }

/* Exercise Card */
.exercise-card {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
  transition: all 0.2s ease;
}
.exercise-card.completed {
  border-color: rgba(0, 230, 118, 0.35);
  background: rgba(0, 230, 118, 0.04);
}
.exercise-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.exercise-info h4 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 2px;
  color: var(--tx);
}
.exercise-meta {
  font-size: 12px;
  color: var(--tx-muted);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tip-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 4px;
}
.form-tip-box {
  background: rgba(5,217,232,0.08);
  border-left: 3px solid var(--accent);
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--tx);
  margin-bottom: 10px;
  display: none;
}
.form-tip-box.show { display: block; }

/* Sets Table */
.sets-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 6px 0;
}
.sets-table th {
  text-align: center;
  color: var(--tx-dim);
  font-weight: 600;
  font-size: 11px;
  padding: 4px 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sets-table th:first-child { text-align: left; }
.set-row {
  border-top: 1px solid var(--border);
  transition: background 0.15s ease;
}
.set-row.done-row {
  background: rgba(0, 230, 118, 0.06);
}
.set-row td {
  padding: 6px 4px;
  vertical-align: middle;
  text-align: center;
}
.set-row td:first-child { text-align: left; }
.set-num {
  font-weight: 700;
  color: var(--tx-muted);
  font-size: 12px;
  display: inline-block;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  border-radius: var(--radius-full);
  background: var(--bg);
}
.set-prev {
  color: var(--tx-dim);
  font-size: 11px;
  white-space: nowrap;
}
.set-input {
  width: 62px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--tx);
  border-radius: 6px;
  padding: 6px 4px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
}
.set-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-subtle);
}
.check-set-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--tx-dim);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.15s ease;
}
.check-set-btn.checked {
  background: var(--success);
  border-color: var(--success);
  color: #0b0e14;
  font-weight: 800;
  box-shadow: 0 2px 8px var(--success-subtle);
}
.set-actions {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  justify-content: flex-end;
}
.small-action-btn {
  background: none;
  border: 1px dashed var(--border-light);
  color: var(--tx-muted);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.small-action-btn:hover { color: var(--tx); border-color: var(--tx-muted); }

/* Quick Rest Timer Trigger */
.rest-trigger-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.rest-trigger-btn:hover { background: var(--accent-glow); }

/* Buttons */
.btn {
  background: var(--primary);
  color: #fff;
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  box-shadow: 0 3px 10px var(--primary-glow);
}
.btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-accent {
  background: var(--accent);
  color: #0b0e14;
  box-shadow: 0 3px 10px var(--accent-glow);
}
.btn-ghost {
  background: var(--card-elevated);
  color: var(--tx);
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn-ghost:hover { background: var(--card-hover); border-color: var(--border-light); }
.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; }
.btn-block { width: 100%; }

/* Grid stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 12px 0;
}
@media (min-width: 480px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
.stat-box {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  text-align: center;
}
.stat-val {
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.1;
}
.stat-val.accent { color: var(--accent); }
.stat-val.success { color: var(--success); }
.stat-lbl {
  font-size: 11px;
  color: var(--tx-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
  font-weight: 600;
}

/* Floating Rest Timer Bar */
.rest-dock {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 540px;
  background: rgba(22, 28, 40, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 15px rgba(5,217,232,0.15);
  z-index: 1000;
  transition: all 0.3s ease;
}
[data-theme="light"] .rest-dock {
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 10px 30px rgba(20,30,50,0.15);
}
.rest-dock.minimized {
  width: auto;
  padding: 8px 14px;
  border-radius: var(--radius-full);
}
.rest-dock.minimized .rest-expanded { display: none; }
.timer-display {
  display: flex;
  align-items: center;
  gap: 10px;
}
.timer-ring-wrap {
  width: 44px;
  height: 44px;
  position: relative;
  display: grid;
  place-items: center;
}
.timer-svg {
  transform: rotate(-90deg);
  width: 44px;
  height: 44px;
}
.timer-bg-circle {
  stroke: var(--border);
  stroke-width: 3.5;
  fill: none;
}
.timer-progress-circle {
  stroke: var(--primary);
  stroke-width: 3.5;
  fill: none;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
}
.timer-num {
  position: absolute;
  font-size: 13px;
  font-weight: 800;
  color: var(--tx);
}
.timer-presets {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.preset-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--tx);
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  cursor: pointer;
}
.preset-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Plate Calculator UI */
.barbell-preview {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px 12px;
  margin: 16px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 120px;
  overflow-x: auto;
}
.barbell-shaft {
  height: 12px;
  background: #718096;
  width: 100%;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 4px;
  z-index: 1;
}
.barbell-collar {
  width: 18px;
  height: 38px;
  background: #a0aec0;
  border-radius: 3px;
  z-index: 2;
  margin-right: 6px;
}
.plates-stack {
  display: flex;
  align-items: center;
  gap: 3px;
  z-index: 2;
}
.plate-disc {
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  box-shadow: 2px 0 4px rgba(0,0,0,0.4);
  user-select: none;
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: -1px;
}
/* Plate colors standard */
.plate-25 { background: #e53e3e; height: 96px; width: 18px; } /* Red */
.plate-20 { background: #3182ce; height: 96px; width: 16px; } /* Blue */
.plate-15 { background: #d69e2e; height: 84px; width: 14px; } /* Yellow */
.plate-10 { background: #38a169; height: 74px; width: 12px; } /* Green */
.plate-5  { background: #cbd5e0; color: #1a202c; height: 60px; width: 10px; } /* White */
.plate-2_5 { background: #1a202c; border: 1px solid #718096; height: 46px; width: 8px; } /* Black */
.plate-1_25{ background: #718096; height: 38px; width: 7px; } /* Silver/Grey */

/* Meals & Habit items */
.meal-item {
  background: var(--card-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.2s ease;
}
.meal-item.done {
  opacity: 0.75;
  border-color: rgba(0,230,118,0.3);
}
.meal-cb {
  width: 22px;
  height: 22px;
  accent-color: var(--primary);
  margin-top: 2px;
  flex: none;
  cursor: pointer;
}
.meal-content { flex: 1; }
.meal-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

}

/* ==========================================================================
   MULTI-TIER DATABASE ENGINE (SQLite Server + IndexedDB + LocalStorage)
   ========================================================================== */
let store = null;
let idb = null;
const IDB_NAME = "IronFitGymDB";
const IDB_VERSION = 1;

// Dynamic API endpoint for Node.js SQLite server
function getApiEndpoint() {
  const custom = localStorage.getItem("ironfit_api_url");
  if (custom) return custom.replace(/\/$/, "");
  // If served over HTTP/HTTPS from a deployed domain or local server
  if (window.location.protocol.startsWith("http")) {
    return window.location.origin + "/api";
  }
  return "http://localhost:3000/api";
}

let dbInfo = {
  activeEngine: "IndexedDB", // "SQLite" | "Supabase" | "IndexedDB" | "LocalStorage"
  isServerOnline: false,
  isCloudOnline: false,
  serverStats: null
};

// Supabase 24/7 Cloud Database Configuration
let supabaseConfig = {
  url: localStorage.getItem("ironfit_sb_url") || "",
  key: localStorage.getItem("ironfit_sb_key") || ""
};

async function loadFromSupabase() {
  if (!supabaseConfig.url || !supabaseConfig.key) return null;
  try {
    const endpoint = `${supabaseConfig.url.replace(/\/$/, "")}/rest/v1/ironfit_data?id=eq.main&select=*`;
    const res = await fetch(endpoint, {
      headers: {
        "apikey": supabaseConfig.key,
        "Authorization": `Bearer ${supabaseConfig.key}`
      }
    });
    if (res.ok) {
      const rows = await res.json();
      if (rows && rows.length && rows[0].data) {
        dbInfo.isCloudOnline = true;
        return rows[0].data;
      }
    }
  } catch (e) {}
  return null;
}

async function saveToSupabase(state) {
  if (!supabaseConfig.url || !supabaseConfig.key) return false;
  try {
    const endpoint = `${supabaseConfig.url.replace(/\/$/, "")}/rest/v1/ironfit_data`;
    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "apikey": supabaseConfig.key,
        "Authorization": `Bearer ${supabaseConfig.key}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify({ id: "main", data: state, updated_at: new Date().toISOString() })
    });
    if (res.ok) {
      dbInfo.isCloudOnline = true;
      return true;
    }
  } catch (e) {}
  return false;
}

// 1. IndexedDB Browser Database Provider
function openIndexedDB() {
  return new Promise(resolve => {
    if (!window.indexedDB) return resolve(null);
    try {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("app_state")) {
          db.createObjectStore("app_state", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("workouts")) {
          db.createObjectStore("workouts", { keyPath: "date" });
        }
        if (!db.objectStoreNames.contains("measurements")) {
          db.createObjectStore("measurements", { keyPath: "id" });
        }
      };
      req.onsuccess = e => {
        idb = e.target.result;
        resolve(idb);
      };
      req.onerror = () => resolve(null);
    } catch (err) {
      resolve(null);
    }
  });
}

function saveToIndexedDB(state) {
  if (!idb) return Promise.resolve(false);
  return new Promise(resolve => {
    try {
      const tx = idb.transaction(["app_state", "workouts", "measurements"], "readwrite");
      const stateStore = tx.objectStore("app_state");
      stateStore.put({ id: "main", data: JSON.stringify(state), updated_at: new Date().toISOString() });

      const wStore = tx.objectStore("workouts");
      for (const [date, rec] of Object.entries(state.days || {})) {
        wStore.put({ date, rec, updated_at: new Date().toISOString() });
      }

      const mStore = tx.objectStore("measurements");
      for (const m of state.body || []) {
        mStore.put({ id: String(m.id), ...m });
      }

      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

function loadFromIndexedDB() {
  if (!idb) return Promise.resolve(null);
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("app_state", "readonly");
      const store = tx.objectStore("app_state");
      const req = store.get("main");
      req.onsuccess = () => {
        if (req.result && req.result.data) {
          try {
            resolve(JSON.parse(req.result.data));
          } catch (e) {
            resolve(null);
          }
        } else {
          resolve(null);
        }
      };
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

// 2. SQLite Backend Server Client
async function checkSQLiteServer() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 1200);
    const res = await fetch(`${getApiEndpoint()}/status`, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (res.ok) {
      const data = await res.json();
      dbInfo.isServerOnline = true;
      dbInfo.serverStats = data;
      dbInfo.activeEngine = "SQLite";
      updateDBBadge();
      return true;
    }
  } catch (e) {}

  dbInfo.isServerOnline = false;
  dbInfo.activeEngine = idb ? "IndexedDB" : "LocalStorage";
  updateDBBadge();
  return false;
}

async function loadFromSQLite() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 1800);
    const res = await fetch(`${getApiEndpoint()}/state`, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {}
  return null;
}

async function saveToSQLite(state) {
  try {
    const res = await fetch(`${getApiEndpoint()}/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

// Main Database Init
async function initStorage() {
  await openIndexedDB();

  let loaded = false;

  // 1. Check if Supabase Cloud Database is configured
  if (supabaseConfig.url && supabaseConfig.key) {
    const sbData = await loadFromSupabase();
    if (sbData && (Object.keys(sbData.days || {}).length > 0 || (sbData.body && sbData.body.length > 0))) {
      S = sbData;
      loaded = true;
    }
  }

  // 2. Check if SQLite server is running
  if (!loaded) {
    const serverUp = await checkSQLiteServer();
    if (serverUp) {
      const sqlData = await loadFromSQLite();
      if (sqlData && (Object.keys(sqlData.days || {}).length > 0 || (sqlData.body && sqlData.body.length > 0))) {
        S = sqlData;
        loaded = true;
      }
    }
  }

  // 3. Fallback to Claude DB if available
  if (!loaded) {
    try {
      if (typeof claude !== "undefined") {
        const u = await claude.use("user"), db = await claude.use("db");
        if (u && db) {
          const id = await u.id();
          if (id) {
            store = db.collection("data/users/" + id).doc("ironfit");
            const snap = await store.get();
            if (snap.exists && snap.data().json) {
              S = JSON.parse(snap.data().json);
              loaded = true;
            }
          }
        }
      }
    } catch (e) {
      store = null;
    }
  }

  // 4. Fallback to IndexedDB
  if (!loaded) {
    const idbData = await loadFromIndexedDB();
    if (idbData && (Object.keys(idbData.days || {}).length > 0 || (idbData.body && idbData.body.length > 0))) {
      S = idbData;
      loaded = true;
    }
  }

  // 5. Fallback to LocalStorage
  if (!loaded) {
    try {
      const raw = localStorage.getItem("ironfit_data") || localStorage.getItem("fit");
      if (raw) {
        S = JSON.parse(raw);
        loaded = true;
      }
    } catch (e) {}
  }

  // Ensure structure
  if (!S.days) S.days = {};
  if (!S.body) S.body = [];
  if (!S.prs) S.prs = {};
  if (!S.customEx) S.customEx = {};

  migrateOldFormat();

  // Apply theme
  const savedTheme = localStorage.getItem("ironfit_theme") || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon();

  // Update streak text
  updateStreak();

  // Render view
  renderApp();
  updateDBBadge();
}

function migrateOldFormat() {
  for (const date in S.days) {
    const d = S.days[date];
    if (d.x && !d.sets) {
      d.sets = {};
      const dayW = new Date(date + "T12:00:00").getDay();
      const plan = WORKOUT_SPLIT[dayW];
      if (plan) {
        plan.exercises.forEach((ex, idx) => {
          d.sets[ex.id] = [{
            w: d.w && d.w[idx] ? d.w[idx] : "",
            r: "10",
            done: !!d.x[idx]
          }];
        });
      }
    }
    if (d.wa !== undefined && d.water === undefined) d.water = d.wa;
    if (d.st !== undefined && d.steps === undefined) d.steps = d.st;
    if (d.m && !d.meals) d.meals = d.m;
  }
}

function saveState() {
  const json = JSON.stringify(S);

  // 1. Fast LocalStorage write
  try {
    localStorage.setItem("ironfit_data", json);
    localStorage.setItem("fit", json);
  } catch (e) {}

  // 2. IndexedDB persistent write
  saveToIndexedDB(S);

  // 3. SQLite Server sync
  if (dbInfo.isServerOnline) {
    saveToSQLite(S);
  }

  // 4. Supabase 24/7 Cloud Database sync
  if (supabaseConfig.url && supabaseConfig.key) {
    saveToSupabase(S);
  }

  // 5. Claude user DB write if active
  if (store) {
    store.set({ json: json }).catch(() => {});
  }

  const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const statusEl = document.getElementById("saveStatus");
  if (statusEl) {
    if (supabaseConfig.url && supabaseConfig.key) {
      statusEl.textContent = `● Synced with Cloud DB & Phone (${timeStr})`;
    } else if (dbInfo.isServerOnline) {
      statusEl.textContent = `● Saved to SQLite DB & IndexedDB (${timeStr})`;
    } else {
      statusEl.textContent = `● Saved to Phone IndexedDB (${timeStr})`;
    }
  }
}

/* ==========================================================================
   AUDIO & HAPTIC SYSTEM (Built-in Web Audio API)
   ========================================================================== */
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

function playBeep(freq = 880, duration = 0.15, type = "sine") {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function playSuccessChime() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      setTimeout(() => playBeep(freq, 0.25, "triangle"), idx * 110);
    });
  } catch (e) {}
}

function triggerHaptic(duration = 25) {
  if ("vibrate" in navigator) {
    try { navigator.vibrate(duration); } catch (e) {}
  }
}

/* ==========================================================================
   REST TIMER CONTROLLER
   ========================================================================== */
let restTimerInterval = null;
let restTimeRemaining = 0;
let restTotalDuration = 60;

function startRestTimer(seconds) {
  clearInterval(restTimerInterval);
  restTotalDuration = seconds;
  restTimeRemaining = seconds;
  getAudioContext(); // prime audio
  triggerHaptic(40);
  playBeep(660, 0.1);

  updateRestTimerUI();

  restTimerInterval = setInterval(() => {
    restTimeRemaining--;
    if (restTimeRemaining <= 0) {
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      restTimeRemaining = 0;
      playSuccessChime();
      triggerHaptic([150, 100, 250]);
      document.getElementById("restStatusText").textContent = "TIME UP! GO! 🔥";
      document.getElementById("restSubText").textContent = "Hit your next set!";
    } else if (restTimeRemaining <= 3) {
      playBeep(440, 0.08); // countdown warning ticks
      triggerHaptic(20);
    }
    updateRestTimerUI();
  }, 1000);
}

function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  restTimeRemaining = 0;
  updateRestTimerUI();
  document.getElementById("restStatusText").textContent = "REST TIMER";
  document.getElementById("restSubText").textContent = "Tap preset to start";
}

function updateRestTimerUI() {
  const mins = Math.floor(restTimeRemaining / 60);
  const secs = restTimeRemaining % 60;
  const str = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
  
  const displayNum = document.getElementById("restCountdown");
  const quickDisplay = document.getElementById("quickTimerDisplay");
  if (displayNum) displayNum.textContent = restTimeRemaining > 0 ? (mins > 0 ? `${mins}m` : `${secs}s`) : "00";
  if (quickDisplay) quickDisplay.textContent = restTimeRemaining > 0 ? str : "Rest";

  // SVG ring
  const circle = document.getElementById("timerRing");
  if (circle) {
    const circumference = 2 * Math.PI * 18; // ~113.1
    const offset = restTotalDuration > 0 ? circumference * (1 - (restTimeRemaining / restTotalDuration)) : 0;
    circle.style.strokeDashoffset = offset;
  }

  const toggleBtn = document.getElementById("timerToggleBtn");
  if (toggleBtn) {
    toggleBtn.textContent = restTimerInterval ? "⏹" : "▶";
    toggleBtn.style.color = restTimerInterval ? "var(--primary)" : "var(--tx)";
  }
}

function renderSVGChart(records, key, label, unit, color) {
  const filtered = records.filter(r => r[key] && !isNaN(parseFloat(r[key])));
  if (filtered.length < 2) {
    return `
      <div class="chart-container">
        <div class="chart-header">
          <span class="chart-title">${label}</span>
          <span class="chart-stat" style="color:var(--tx-dim);">Need at least 2 entries for chart</span>
        </div>
      </div>
    `;
  }

  const values = filtered.map(r => parseFloat(r[key]));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const first = values[0];
  const last = values[values.length - 1];
  const diff = (last - first).toFixed(1);
  const diffSign = diff > 0 ? `+${diff}` : `${diff}`;

  const width = 320;
  const height = 90;
  const paddingX = 15;
  const paddingY = 15;

  const points = values.map((val, idx) => {
    const x = paddingX + idx * ((width - 2 * paddingX) / (values.length - 1));
    const y = height - paddingY - ((val - min) / range) * (height - 2 * paddingY);
    return [x.toFixed(1), y.toFixed(1)];
  });

  const polylineStr = points.map(p => p.join(",")).join(" ");

  return `
    <div class="chart-container">
      <div class="chart-header">
        <span class="chart-title">${label}</span>
        <span class="chart-stat">${first} → ${last} ${unit} (${diffSign} ${unit})</span>
      </div>
      <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; overflow:visible;">
        <defs>
          <linearGradient id="grad-${key}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.3"></stop>
            <stop offset="100%" stop-color="${color}" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <polygon fill="url(#grad-${key})" points="${points[0][0]},${height} ${polylineStr} ${points[points.length - 1][0]},${height}"></polygon>
        <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polylineStr}"></polyline>
        ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}" stroke="var(--card)" stroke-width="1.5"></circle>`).join("")}
      </svg>
    </div>
  `;
}

  return `

function updateTDEEDisplay() {
  const w = parseFloat(document.getElementById("tdeeWeight")?.value) || 60;
  const h = parseFloat(document.getElementById("tdeeHeight")?.value) || 165;
  const a = parseFloat(document.getElementById("tdeeAge")?.value) || 24;
  const gender = document.getElementById("tdeeGender")?.value || "female";
  const goal = document.getElementById("tdeeGoal")?.value || "cut";
  const box = document.getElementById("tdeeResultBox");
  if (!box) return;

  // Mifflin-St Jeor Formula
  let bmr = 10 * w + 6.25 * h - 5 * a + (gender === "male" ? 5 : -161);
  let tdee = Math.round(bmr * 1.45); // Moderate activity (gym 4-6 days)

  let targetCal = tdee;
  if (goal === "cut") targetCal = Math.round(tdee * 0.80);
  if (goal === "bulk") targetCal = Math.round(tdee * 1.10);

  // Protein recommendation: 1.8g to 2.0g per kg of body weight
  const proteinGrams = Math.round(w * 1.8);
  const fatGrams = Math.round((targetCal * 0.25) / 9);
  const carbGrams = Math.round((targetCal - (proteinGrams * 4 + fatGrams * 9)) / 4);

  box.innerHTML = `
    <div class="stats-grid" style="margin-top:14px;">
      <div class="stat-box">
        <div class="stat-val accent">${targetCal}</div>
        <div class="stat-lbl">Calories / Day</div>
      </div>
      <div class="stat-box">
        <div class="stat-val success">${proteinGrams}g</div>
        <div class="stat-lbl">Daily Protein</div>
      </div>

let hiitInterval = null;
let hiitCurrentRound = 1;
let hiitIsWorkPhase = true;
let hiitTime = 30;

function toggleHIIT() {
  const btn = document.getElementById("startHIITBtn");
  if (hiitInterval) {
    clearInterval(hiitInterval);
    hiitInterval = null;
    if (btn) btn.textContent = "▶ Resume";
    return;
  }

  const workSec = parseInt(document.getElementById("hiitWork")?.value) || 30;
  const restSec = parseInt(document.getElementById("hiitRest")?.value) || 15;
  const totalRounds = parseInt(document.getElementById("hiitRounds")?.value) || 8;

  if (btn) btn.textContent = "⏸ Pause";
  getAudioContext();
  playBeep(880, 0.2);

  hiitInterval = setInterval(() => {
    hiitTime--;
    if (hiitTime <= 0) {
      if (hiitIsWorkPhase) {
        hiitIsWorkPhase = false;
        hiitTime = restSec;
        playBeep(440, 0.3); // low tone for rest
        triggerHaptic(100);
      } else {
        hiitCurrentRound++;
        if (hiitCurrentRound > totalRounds) {
          clearInterval(hiitInterval);
          hiitInterval = null;
          playSuccessChime();
          triggerHaptic([200, 100, 300]);
          document.getElementById("hiitPhaseLabel").textContent = "CIRCUIT COMPLETE! 🎉";
          document.getElementById("hiitBigTime").textContent = "DONE";
          if (btn) btn.textContent = "▶ Start Again";
          return;
        }
        hiitIsWorkPhase = true;
        hiitTime = workSec;
        playBeep(880, 0.3); // high tone for work
        triggerHaptic([50, 50, 50]);
      }
    } else if (hiitTime <= 3) {
      playBeep(587.33, 0.08);
      triggerHaptic(20);
    }

    const phaseLbl = document.getElementById("hiitPhaseLabel");
    const bigTime = document.getElementById("hiitBigTime");
    const roundDisp = document.getElementById("hiitRoundDisplay");

    if (phaseLbl) {
      phaseLbl.textContent = hiitIsWorkPhase ? "WORK HARD! 🔥" : "REST & BREATHE 💨";
      phaseLbl.style.color = hiitIsWorkPhase ? "var(--primary)" : "var(--accent)";
    }
    if (bigTime) bigTime.textContent = hiitTime;
    if (roundDisp) roundDisp.textContent = `Round ${hiitCurrentRound} / ${totalRounds}`;
  }, 1000);
}

function resetHIIT() {
  if (hiitInterval) clearInterval(hiitInterval);
  hiitInterval = null;
  hiitCurrentRound = 1;
  hiitIsWorkPhase = true;
  const workSec = parseInt(document.getElementById("hiitWork")?.value) || 30;
  hiitTime = workSec;
  
  const btn = document.getElementById("startHIITBtn");
  if (btn) btn.textContent = "▶ Start Interval";
  const phaseLbl = document.getElementById("hiitPhaseLabel");
  const bigTime = document.getElementById("hiitBigTime");
  const roundDisp = document.getElementById("hiitRoundDisplay");
  if (phaseLbl) { phaseLbl.textContent = "READY"; phaseLbl.style.color = "var(--accent)"; }
  if (bigTime) bigTime.textContent = workSec;
  if (roundDisp) roundDisp.textContent = `Round 1 / ${document.getElementById("hiitRounds")?.value || 8}`;
}

/* ==========================================================================
   CONFETTI CANNON (Celebration Animation)
   ========================================================================== */
function launchConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confettiCount = 120;
  const confetti = [];
  const colors = ["#ff2a6d", "#05d9e8", "#00e676", "#ffb300", "#9b00e8"];

  for (let i = 0; i < confettiCount; i++) {
    confetti.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.7) * 18,
      rotation: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 10,
      alpha: 1
    });
  }

  let animationFrame;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;

    confetti.forEach(c => {
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.4; // gravity
      c.rotation += c.rSpeed;
      c.alpha -= 0.012;

      if (c.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
    });

    if (alive) {
      animationFrame = requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  cancelAnimationFrame(animationFrame);
  animate();
}

/* ==========================================================================
   STREAK & QUOTES
   ========================================================================== */
function updateStreak() {
  const dates = Object.keys(S.days).sort();
  let streak = 0;
  let check = new Date();

  for (let i = 0; i < 365; i++) {
    const ds = check.getFullYear() + "-" + String(check.getMonth() + 1).padStart(2, "0") + "-" + String(check.getDate()).padStart(2, "0");
    const rec = S.days[ds];
    const hasWorkout = rec && rec.sets && Object.values(rec.sets).some(arr => arr.some(s => s.done));
    const hasDiet = rec && rec.water >= 6;

    if (hasWorkout || hasDiet) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else {
      if (i === 0) {
        // maybe haven't finished today yet, check yesterday
        check.setDate(check.getDate() - 1);
        continue;
      }
      break;
    }
  }

  const streakEl = document.getElementById("streakText");
  if (streakEl) {
    streakEl.textContent = `Streak: ${Math.max(1, streak)} Days Active 🔥`;
  }

  const quoteEl = document.getElementById("quoteText");
  if (quoteEl) {
    const q = MOTIVATIONAL_QUOTES[new Date().getDate() % MOTIVATIONAL_QUOTES.length];
    quoteEl.textContent = q;
  }
}

document.addEventListener("click", e => {
  // Navigation tabs
  const tabBtn = e.target.closest(".tab-btn");
  if (tabBtn) {
    activeTab = tabBtn.dataset.tab;
    renderApp();
    return;
  }

  // Day chip switcher
  const dayChip = e.target.closest(".day-chip");
  if (dayChip) {
    selectedDayNum = parseInt(dayChip.dataset.day);
    renderApp();
    return;
  }

  // Form tip toggle
  const tipBtn = e.target.closest(".tip-btn");
  if (tipBtn) {
    const exId = tipBtn.dataset.tip;
    const box = document.getElementById(`tip-${exId}`);
    if (box) box.classList.toggle("show");
    return;
  }

  // Action buttons
  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const act = actBtn.dataset.act;
    const dayRec = getDayRecord(selectedDateStr);

    if (act === "check-set") {
      const exId = actBtn.dataset.ex;
      const setIdx = parseInt(actBtn.dataset.set);
      if (dayRec.sets[exId] && dayRec.sets[exId][setIdx]) {
        const item = dayRec.sets[exId][setIdx];
        item.done = !item.done;

        // Auto-fill weight from row if empty
        const row = actBtn.closest(".set-row");
        const wInput = row.querySelector(".set-weight");
        const rInput = row.querySelector(".set-reps");
        if (wInput && wInput.value) item.w = wInput.value;
        if (rInput && rInput.value) item.r = rInput.value;

        triggerHaptic(item.done ? 40 : 20);
        if (item.done) {
          playBeep(880, 0.12);
          // start rest timer automatically on set completion
          startRestTimer(60);
        }

        saveState();
        renderApp();
      }
      return;
    }

    if (act === "add-set") {
      const exId = actBtn.dataset.ex;
      if (!dayRec.sets[exId]) dayRec.sets[exId] = [];
      const last = dayRec.sets[exId][dayRec.sets[exId].length - 1];
      dayRec.sets[exId].push({
        w: last ? last.w : "",
        r: last ? last.r : "10",
        done: false
      });
      saveState();
      renderApp();
      return;
    }

    if (act === "del-set") {
      const exId = actBtn.dataset.ex;
      if (dayRec.sets[exId] && dayRec.sets[exId].length > 1) {
        dayRec.sets[exId].pop();
        saveState();
        renderApp();
      }
      return;
    }

    if (act === "quick-rest") {
      startRestTimer(60);
      return;
    }

    if (act === "toggle-glass") {
      const idx = parseInt(actBtn.dataset.idx);
      dayRec.water = idx + 1;
      triggerHaptic(30);
      playBeep(520, 0.1);
      saveState();
      renderApp();
      return;
    }

    if (act === "water-add") {
      dayRec.water = Math.min(24, (dayRec.water || 0) + 1);
      triggerHaptic(30);
      playBeep(600, 0.1);
      saveState();
      renderApp();
      return;
    }

    if (act === "water-sub") {
      dayRec.water = Math.max(0, (dayRec.water || 0) - 1);
      saveState();
      renderApp();
      return;
    }

    if (act === "water-bottle") {
      dayRec.water = Math.min(24, (dayRec.water || 0) + 2); // 500ml = 2 glasses
      triggerHaptic(40);
      playBeep(700, 0.12);
      saveState();
      renderApp();
      return;
    }

    if (act === "check-meal") {
      const mealIdx = actBtn.dataset.meal;
      if (!dayRec.meals) dayRec.meals = {};
      dayRec.meals[mealIdx] = actBtn.checked;
      triggerHaptic(25);
      saveState();
      renderApp();
      return;
    }

    if (act === "del-meas") {
      const id = actBtn.dataset.id;
      S.body = S.body.filter(r => String(r.id) !== String(id));
      saveState();
      renderApp();
      return;
    }
  }

  // Timer presets in floating dock
  const presetBtn = e.target.closest(".preset-btn");
  if (presetBtn) {
    const sec = parseInt(presetBtn.dataset.timer);
    startRestTimer(sec);
    return;
  }

  // Timer toggle button
  if (e.target.closest("#timerToggleBtn")) {
    if (restTimerInterval) {
      stopRestTimer();
    } else {
      startRestTimer(60);
    }
    return;
  }

  if (e.target.closest("#timerQuickBtn")) {
    startRestTimer(60);
    return;
  }

  // Header toggles
  if (e.target.closest("#themeToggle")) {
    toggleTheme();
    return;
  }

  if (e.target.closest("#langToggle")) {
    toggleLang();
    return;
  }

  if (e.target.closest("#toolsBtn")) {
    activeTab = "tools";
    renderApp();
    return;
  }

  // Tools Selector
  const toolTile = e.target.closest(".tool-tile");
  if (toolTile) {
    const t = toolTile.dataset.tool;
    const area = document.getElementById("activeToolArea");
    if (area) {
      if (t === "plate") area.innerHTML = renderPlateCalculatorHTML();

  // HIIT timer buttons

    toggleHIIT();
    return;

    resetHIIT();
    return;

  }

  // Force Sync DB Button inside modal
  if (e.target.closest("#forceSyncDbBtn")) {
    saveState();
    triggerHaptic(50);
    playSuccessChime();
    const btn = document.getElementById("forceSyncDbBtn");
    if (btn) btn.textContent = "✓ Synced with SQLite!";
    setTimeout(() => closeModal(), 800);
    return;
  }

  // Retry Connection Button inside modal
  if (e.target.closest("#retryDbConnBtn")) {
    const btn = document.getElementById("retryDbConnBtn");
    if (btn) btn.textContent = "Checking...";
    checkSQLiteServer().then(online => {
      if (btn) btn.textContent = online ? "Connected! 🎉" : "Not running yet";
      setTimeout(() => closeModal(), 1000);
    });
    return;
  }

  // Backup & Restore link
  if (e.target.closest("#backupLink")) {
    e.preventDefault();
    showModal("Backup & Restore Data", `
      <div style="font-size:13px; line-height:1.5;">
        <p style="margin-bottom:14px; color:var(--tx-muted);">Export your entire workout history and measurements as a JSON file to transfer between devices.</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn btn-accent" id="exportJsonBtn">📥 Download JSON Backup</button>
          <div style="border-top:1px solid var(--border); margin:8px 0; padding-top:10px;">
            <label class="form-label">Restore from JSON File</label>
            <input type="file" id="importJsonInput" accept=".json" class="form-input" style="padding:6px;">
          </div>
        </div>
      </div>
    `);
    return;
  }

  // Export JSON Backup
  if (e.target.closest("#exportJsonBtn")) {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ironfit-pro-backup-${selectedDateStr}.json`;
    a.click();
    return;
  }

  // Modal Close
  if (e.target.closest("#modalClose") || e.target === document.getElementById("modalOverlay")) {
    closeModal();
    return;
  }
});

// Input Changes
document.addEventListener("input", e => {
  const t = e.target;
  const dayRec = getDayRecord(selectedDateStr);

  // Set Inputs
  if (t.classList.contains("set-weight")) {
    const exId = t.dataset.ex;
    const setIdx = parseInt(t.dataset.set);
    if (dayRec.sets[exId] && dayRec.sets[exId][setIdx]) {
      dayRec.sets[exId][setIdx].w = t.value;
      saveState();
    }
  } else if (t.classList.contains("set-reps")) {
    const exId = t.dataset.ex;
    const setIdx = parseInt(t.dataset.set);
    if (dayRec.sets[exId] && dayRec.sets[exId][setIdx]) {
      dayRec.sets[exId][setIdx].r = t.value;
      saveState();
    }
  } else if (t.id === "stepsInput") {
    dayRec.steps = parseInt(t.value) || 0;
    saveState();
  } else if (t.id === "sleepInput") {
    dayRec.sleep = parseFloat(t.value) || 0;
    saveState();
  } else if (t.id === "plateTargetInput" || t.id === "barWeightSelect") {
    const target = parseFloat(document.getElementById("plateTargetInput")?.value) || 60;
    const bar = parseFloat(document.getElementById("barWeightSelect")?.value) || 20;
    const area = document.getElementById("activeToolArea");
    if (area) area.innerHTML = renderPlateCalculatorHTML(target, bar);
  } else if (t.id === "ormWeight" || t.id === "ormReps") {
    update1RMDisplay();
  } else if (t.id === "tdeeWeight" || t.id === "tdeeHeight" || t.id === "tdeeAge" || t.id === "tdeeGender" || t.id === "tdeeGoal") {
    updateTDEEDisplay();
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "datePicker") {
    if (t.value) {
      selectedDateStr = t.value;
      selectedDayNum = new Date(t.value + "T12:00:00").getDay();
      renderApp();
    }
  } else if (t.id === "importJsonInput") {
    const file = t.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && (parsed.days || parsed.body)) {
            S = parsed;
            saveState();
            closeModal();
            renderApp();
            alert("Backup successfully restored! 🎉");
          } else {
            alert("Invalid backup file format.");
          }
        } catch (err) {
          alert("Error parsing JSON file.");
        }
      };
      reader.readAsText(file);
    }
  }
});

// Initialize on page load
initStorage();
</script>
</body>
</html>
